# PDF Q&A — the whole product in one command (this is what runs on AWS EC2)
#   docker compose up -d --build     -> http://localhost:8000
#   docker compose logs -f           -> view logs
#   docker compose down              -> stop (data stays safe in ./data)
services:
  app:
    build: .
    image: pdf-qa
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false   # works without .env too (database-search mode)
    volumes:
      - ./data:/app/data  # SQLite database + uploaded PDFs live here
    restart: unless-stopped
